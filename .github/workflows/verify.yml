name: Verify connectors

on:
  pull_request:
  push:
    branches: [main]

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check catalog shape
        run: python3 scripts/verify_catalog.py
      - name: Check remote and local connectors
        run: python3 scripts/verify_catalog.py --handshake --tools
